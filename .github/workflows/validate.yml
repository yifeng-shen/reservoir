name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate structure and permissions
        run: python3 scripts/validate.py

      - name: Check index.json is up to date
        run: python3 scripts/build_index.py --check

      - name: Lint MCP server (syntax)
        run: python3 -m py_compile mcp/server.py scripts/validate.py scripts/build_index.py
